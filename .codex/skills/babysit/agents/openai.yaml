interface:
  display_name: "Babysit"
  short_description: "Launch an isolated worktree task to babysit a PR"
  default_prompt: "Use $babysit to launch an isolated babysitter for the current PR. In launcher mode, resolve and deduplicate the PR, fetch its head into a remote-tracking ref without checking it out, and create one Codex-managed worktree task using gpt-5.6-sol with medium reasoning. Put the canonical BABYSIT_PR_WORKER marker, full PR metadata including title and body, and the project environment config path when present in the worker prompt, then stop without running the watcher in this foreground checkout. In worker mode, never spawn another task: stay on detached HEAD in the managed worktree, use the explicit PR URL, and when no local environment was selected run the supplied `[setup].script` once before the first edit or validation. Before edits, read the current PR body and every directly linked ticket or specification, including Notion pages, and establish the intended outcome, acceptance criteria, and non-goals; stop for user help if required context is inaccessible, conflicting, or materially ambiguous. Monitor all published feedback, CI, and mergeability, and keep watching until a strict stop condition. Keep the 30-second polling cadence, but after the initial snapshot report only meaningful state changes, actions, blockers, or terminal outcomes. Never post heartbeat, liveness, still-watching, or unchanged-status updates; silence means the watcher is healthy and unchanged. The watcher suppresses identical snapshots, so continue waiting without commentary when no new output arrives, and align nested wait/yield timeouts to avoid redundant model resumptions. Keep fetched review items pending until their disposition is complete, then explicitly acknowledge them. For every reported issue, compare merge-base behavior with PR-head behavior and assess real-world reachability, likelihood, impact, and fit with the established intent. Fix only practical in-scope issues introduced or materially worsened by the PR; escalate technically valid feedback that broadens product scope instead of implementing it automatically; give evidence-backed no-change dispositions for unchanged pre-existing issues and negligible theoretical edge cases, and surface material pre-existing risks separately instead of expanding the PR. For each code adjustment, apply KISS first: state the exact defect and smallest direct fix, prefer the existing ownership seam, and reject new abstractions added only for possible future reuse. Apply Human Code within that minimal shape, then inspect the completed diff through KISS again and simplify it before validation. Use create-commit for one small atomic conventional commit per independent issue. Before pushing, verify the remote PR head has not advanced; never force-push, and push detached HEAD explicitly to the PR head branch. Reply only inside real inline review threads using thread_root_id and verify in_reply_to_id; never create top-level fallback comments. Write every inline reply in an Explain-it-like-I'm-a-junior style for outside readers: lead with the outcome and practical reason, use plain language, briefly explain unavoidable jargon, and omit the investigation diary. End every automated inline reply with the exact signature `*🤖 Addressed by [Codex](https://openai.com/codex/)*`. Restart the watcher after every push, acknowledgement, or rerun and keep the worker task active."

policy:
  allow_implicit_invocation: false
