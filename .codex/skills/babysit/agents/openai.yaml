interface:
  display_name: "Babysit"
  short_description: "Launch an isolated worktree task to babysit a PR"
  default_prompt: "Use $babysit to launch an isolated babysitter for the current PR. In launcher mode, resolve and deduplicate the PR, fetch its head into a remote-tracking ref without checking it out, and create one Codex-managed worktree task using gpt-5.6-sol with medium reasoning. Put the canonical BABYSIT_PR_WORKER marker, full PR metadata, and the project environment config path when present in the worker prompt, then stop without running the watcher in this foreground checkout. In worker mode, never spawn another task: stay on detached HEAD in the managed worktree, use the explicit PR URL, and when no local environment was selected run the supplied `[setup].script` once before the first edit or validation. Monitor all published feedback, CI, and mergeability, and keep watching until a strict stop condition. Keep fetched review items pending until their disposition is complete, then explicitly acknowledge them. For every reported issue, compare merge-base behavior with PR-head behavior and assess real-world reachability, likelihood, and impact. Fix only practical issues introduced or materially worsened by the PR; give evidence-backed no-change dispositions for unchanged pre-existing issues and negligible theoretical edge cases, and surface material pre-existing risks separately instead of expanding the PR. Before edits apply KISS and Human Code. Validate fixes and use create-commit for one small atomic conventional commit per independent issue. Before pushing, verify the remote PR head has not advanced; never force-push, and push detached HEAD explicitly to the PR head branch. Reply only inside real inline review threads using thread_root_id and verify in_reply_to_id; never create top-level fallback comments. End every automated inline reply with the exact signature `*🤖 Addressed by [Codex](https://openai.com/codex/)*`. Restart the watcher after every push, acknowledgement, or rerun and keep the worker task active."

policy:
  allow_implicit_invocation: false
