dock-icon-preference = "codex-system"
followUpQueueMode = "steer"
git-branch-prefix = "feat/"
git-commit-instructions = """
Create commit(s) from the current changes. Do not edit or format files.

## Commit boundaries

- Base commit boundaries on the actual diff.
- Each commit should represent one reason to revert.
- Split independent behavior, refactors, configuration, tooling, and dependency changes.
- Keep changes together when separating them would leave the repository broken or make either commit misleading.
- Never include unrelated changes.
- If a file contains multiple concerns, stage only the relevant hunks.

## Commit types

- Runtime dependencies: `chore(deps): ...`
- Development, test, or build dependencies: `chore(deps-dev): ...`
- Tooling, configuration, or setup: `chore(scope): ...`
- Behavior-preserving changes: `refactor(scope): ...`
- Documentation only: `docs(scope): ...`
- Test-only infrastructure or plumbing: `test(scope): ...`
- Keep behavior tests with the change they prove.

## Commit messages

- Use `type(scope): description`.
- Prefer a feature or domain scope over a package name.
- Keep titles lowercase, imperative, and under 100 characters.
- Describe the outcome, not the implementation.
- Prefer title-only commits.
- Add a body only for important motivation, migration details, or non-obvious constraints."""
git-create-pull-request-as-draft = true
git-pr-instructions = """
Create a pull request for the current branch using the base branch and draft state supplied by the action.

## Title

- Use Conventional Commits format: `type(scope): description`.
- Keep it lowercase and imperative.
- Describe the overall outcome of the PR.
- Append a relevant Notion ticket as `[TL-1234]` only when one is present in the branch context.
- Keep code identifiers out of the title unless essential; wrap them in backticks when used.

## Description

- Derive the description from the actual diff, not only the commit messages.
- Explain the user or business outcome and the meaningful implementation changes.
- Use concise `###` sections appropriate to the change.
- Wrap code identifiers such as functions, variables, parameters, keys, and enum values in backticks.
- Do not include checkboxes, checklists, test plans, testing sections, or boilerplate.
- Do not mention changes that are not present in the diff."""
